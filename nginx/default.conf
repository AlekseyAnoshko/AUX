# /etc/nginx/sites-available/default

server {
    listen 80;
    server_name cloud-b.istu.edu;
#    return 301 https://$host$request_uri; # выпилили этот редирект
    location /s { # а вот эти блоки утащили сюда, в обычный HTTP
        proxy_pass http://127.0.0.1:10080;
    }
}

server {
    listen 443 ssl;
    server_name cloud-b.istu.edu;

    ssl_certificate     /home/aaf/meeting-server/nginx/certs/server.crt;
    ssl_certificate_key /home/aaf/meeting-server/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Проект /s ────────────────────────────────────────────────
    location /s {
        add_header X-Hdr-A  test;
        proxy_pass http://127.0.0.1:10080;
    }

    # ── Проект /aux ──────────────────────────────────────────────

    # Редирект /aux → /aux/
    location = /aux {
        return 301 /aux/;
    }

    # Главная страница — напрямую с диска
    location = /aux/ {
        root  /var/www;
        try_files /aux/index.html =404;
    }

    # Статика JS: /aux/static/... → FastAPI /static/...
    location ^~ /aux/static/ {
        rewrite ^/aux/(.*)$ /$1 break;
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket: /aux/ws/... → FastAPI /ws/...
    location ^~ /aux/ws/ {
        rewrite ^/aux/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Протоколы: /aux/protocols → FastAPI /protocols
    location ^~ /aux/protocols {
        rewrite ^/aux/(.*)$ /$1 break;
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
