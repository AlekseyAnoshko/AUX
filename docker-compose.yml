services:
  aux_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aux_app:latest
    container_name: aux_app
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./model:/src/model:ro
      - ./protocols:/src/protocols:rw
      - ./index.html:/src/static/index.html:ro

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          cpus: "8"
          memory: "8G"
        reservations:
          memory: "2G"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
