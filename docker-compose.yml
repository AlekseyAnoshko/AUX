version: "3.9"

services:
  aux_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aux_app:latest
    container_name: aux_app
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      # FIX: пути исправлены с /src/ на /app/src/ (WORKDIR=/app в Dockerfile)
     - /var/www/aux/index.html:/app/src/static/index.html:ro
     - ./protocols:/app/src/protocols:rw

    environment:
      TZ:              "Asia/Irkutsk"
      OLLAMA_URL:      "http://host.docker.internal:18787/api/generate"
      OLLAMA_MODEL:    "qwen2.5:7b"
      # FIX: пути исправлены с /src/ на /app/src/
      PROTOCOLS_DIR:   "/app/src/protocols"
      VOSK_MODEL_PATH: "/app/src/model"
      STATIC_DIR:      "/app/src/static"
      OMP_NUM_THREADS: "4"
      # FIX: явно указываем разрешённые origins для CORS (вместо wildcard + credentials)
      ALLOW_ORIGINS:   "https://cloud-b.istu.edu"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          cpus: "12"
          memory: "16G"
        reservations:
          memory: "2G"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
